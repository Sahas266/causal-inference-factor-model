version: '3.8'

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: defi_pipeline
      POSTGRES_USER: defi_user
      POSTGRES_PASSWORD: defi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_timescaledb.sql:/docker-entrypoint-initdb.d/init_timescaledb.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defi_user -d defi_pipeline"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI application
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://defi_user:defi_password@postgres:5432/defi_pipeline
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      CACHE_TTL: 300
      MAX_WORKERS: 4
      RATE_LIMIT_PER_MINUTE: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Celery worker
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "app.tasks.scheduled", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql://defi_user:defi_password@postgres:5432/defi_pipeline
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # Celery beat (scheduler)
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "app.tasks.scheduled", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql://defi_user:defi_password@postgres:5432/defi_pipeline
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: defi_pipeline_network
