# Packages ONLY the execution layer (causal_portfolio.execution) as an
# installable library. Version single-sourced from execution/__init__.py.
#
# Architectural boundary — causal_portfolio.execution is model-agnostic:
# it depends on stdlib, requests, and the Hyperliquid SDK, and on NOTHING
# else in this repository. Models depend on execution, never the reverse.
# Concretely, causal_portfolio.execution must not import causal_portfolio.
# {data,factors,solvers,backtest,models}, numpy, or pandas. Models live in
# causal_portfolio.models and reach the exchange only through the standard
# handoff execute_target(TargetSnapshot, ExecutionConfig) -> SubmitResult.
# test_execution_is_model_agnostic.py enforces this; keep it passing.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpcm-execution"
dynamic = ["version"]
description = "CPCM Hyperliquid execution layer: target weights -> safe perp orders (plan, execute, reconcile, repair, audit, notify)"
readme = "causal_portfolio/execution/README.md"
requires-python = ">=3.11"
dependencies = [
    # Stay within tested minor lines while accepting compatible security fixes.
    "hyperliquid-python-sdk~=0.24.0",
    "eth-account~=0.13.7",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Models are NOT packaged (they live in the repo under causal_portfolio.models
# and would violate the model-agnostic boundary above). This extra exists so a
# repo checkout can install the model runner's numeric stack alongside the
# library; the wheel itself ships no model code.
model = ["numpy", "pandas"]

[project.scripts]
cpcm-exec = "causal_portfolio.execution.cli:main"
cpcm-notify = "causal_portfolio.execution.notify:main"

[tool.setuptools.dynamic]
version = {attr = "causal_portfolio.execution.__version__"}

[tool.setuptools.packages.find]
include = ["causal_portfolio.execution*"]
namespaces = true
