[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# Graph
petgraph = "0.6"

# Data
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
polars = { version = "0.46", features = ["lazy", "parquet", "csv", "temporal", "dtype-date", "pivot"] }
dotenvy = "0.15"

# Numerics
nalgebra = "0.33"
statrs = "0.18"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
cpcm-core = { path = "crates/cpcm-core" }
cpcm-data = { path = "crates/cpcm-data" }
cpcm-factors = { path = "crates/cpcm-factors" }
cpcm-estimate = { path = "crates/cpcm-estimate" }
