[pytest]
# Pytest configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_api_key: Tests that require API keys
    requires_database: Tests that require database connection

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=src --cov-report=html

